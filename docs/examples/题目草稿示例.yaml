- type: single_choice
  stem: |
    下列代码执行后 $n$ 的值是？

    ```python
    n = 1
    for i in range(10):
        n *= 2
    ```
  payload:
    type: single_choice
    options:
      - {label: A, content: "1024", is_correct: true}
      - {label: B, content: "1023"}
      - {label: C, content: "$2^{11}$"}
