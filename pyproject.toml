[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qbank"
version = "0.1.0"
description = "跨平台题库管理系统：多课程题目管理、批量导入、自动组卷与多格式导出"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "zhwen" }]
keywords = ["question-bank", "exam", "education", "markdown", "latex"]

dependencies = [
  # 存储与校验
  "SQLAlchemy>=2.0.30",
  "alembic>=1.13",
  "pydantic>=2.7",
  # 内容处理
  "markdown-it-py>=3.0",
  "mdit-py-plugins>=0.4",
  "nh3>=0.2.17",          # HTML 白名单 sanitize（Rust 实现，无系统依赖）
  "jieba>=0.42.1",        # 中文分词，喂给 FTS5
  "Pillow>=10.3",         # 图片尺寸探测与压缩
  # 模板与格式转换
  "Jinja2>=3.1.4",
  "PyYAML>=6.0",
  "pypandoc_binary>=1.13",  # 自带 pandoc 二进制，三平台开箱即用
  # 基础设施
  "platformdirs>=4.2",
  "typer>=0.12",
]

[project.optional-dependencies]
web = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2",
]
desktop = ["pywebview>=5.1"]
pdf = ["playwright>=1.44"]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "pre-commit>=3.7",
  "httpx>=0.27",          # FastAPI TestClient
  "python-docx>=1.1",     # 仅测试用：构造 docx fixture
]

[project.scripts]
qbank = "qbank.cli:app"

[project.urls]
Repository = "https://github.com/zhwen/question_bank"

[tool.hatch.build.targets.wheel]
packages = ["src/qbank"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",    # pycodestyle / pyflakes
  "I",              # isort
  "UP",             # pyupgrade
  "B",              # bugbear
  "A",              # 内置名/模块名遮蔽（A005 正是 qbank.io 改名 qbank.exchange 的原因）
  "C4", "SIM",      # 推导式 / 可简化写法
  "PTH",            # 强制 pathlib，不手拼路径分隔符（跨平台要求）
  "RUF",
]
ignore = [
  "RUF001", "RUF002", "RUF003",  # 全角标点在中文注释/文档串里是正常的
  "B008",                        # FastAPI Depends() 默认值是惯用写法
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"migrations/**" = ["E501", "I001"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.10"
files = ["src/qbank"]
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["jieba.*", "pypandoc.*", "webview.*", "nh3.*", "mdit_py_plugins.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
  "slow: 需要 Chromium/pandoc 等重依赖，pre-commit 的快速子集会跳过",
  "pandoc: 需要 pandoc 可用",
  "pdf: 需要 Playwright 浏览器内核已安装",
]

[tool.coverage.run]
source = ["qbank"]
branch = true
