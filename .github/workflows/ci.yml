name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[web,dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy

      # pandoc 由 pypandoc_binary 自带，无需额外安装；此处确认三平台都探测得到
      - name: Toolchain doctor
        run: python -m qbank.cli doctor

      # 保留 -m "not pdf"：导出功能（M5）上线后，PDF 相关测试需要 Chromium
      # 内核，届时再加回「只在 Linux 上装 chromium 并跑 pytest -m pdf」两步。
      # 现在还没有任何测试带 pdf 标记，贸然跑 `pytest -m pdf` 会因「未选中任何
      # 测试」退出码 5 而让 CI 变红。
      - name: Test
        run: pytest -m "not pdf" --cov --cov-report=term-missing
