name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[web,dev,pdf]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy

      # pandoc 由 pypandoc_binary 自带，无需额外安装；此处确认三平台都探测得到
      - name: Toolchain doctor
        run: python -m qbank.cli doctor

      - name: Test (不含 PDF)
        run: pytest -m "not pdf" --cov --cov-report=term-missing

      # Chromium 内核较大，只在 Linux 上验证 PDF 链路，节省 CI 时间
      - name: Install Chromium (linux only)
        if: matrix.os == 'ubuntu-latest'
        run: python -m playwright install --with-deps chromium

      - name: Test PDF (linux only)
        if: matrix.os == 'ubuntu-latest'
        run: pytest -m pdf
