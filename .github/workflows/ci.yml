name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[web,dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy

      # pandoc 由 pypandoc_binary 自带，无需额外安装；此处确认三平台都探测得到
      - name: Toolchain doctor
        run: python -m qbank.cli doctor

      # 不再排除 pdf 标记：PDF 导出会先找 Playwright 自带内核，再找系统装的
      # Chrome / Edge，而三平台的 GitHub runner 都预装了 Chrome。找不到任何
      # 内核时相关用例自己 skip，不会让 CI 变红——所以这里直接全量跑，白得一份
      # 「PDF 到底能不能出来」的覆盖。
      - name: Test
        run: pytest --cov --cov-report=term-missing
